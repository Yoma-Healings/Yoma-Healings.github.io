services:
  - type: web
    name: harrison-portfolio
    runtime: node
    plan: free
    region: frankfurt
    branch: portfolio-app-backend
    rootDir: portfolio-app
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm run seed:projects && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
