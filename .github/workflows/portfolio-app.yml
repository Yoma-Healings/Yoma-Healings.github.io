name: Portfolio app checks

on:
  push:
    paths:
      - "portfolio-app/**"
      - ".github/workflows/portfolio-app.yml"
  pull_request:
    paths:
      - "portfolio-app/**"
      - ".github/workflows/portfolio-app.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-app
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: npm --version
      - run: npm install
      - run: npm run check
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_URL: postgresql://test:test@localhost:5432/test
